baseURL = "https://www.fu-zock.com/"
title = "かぶきあげのFU-ZOCKレポ"
languageCode = "ja"
enableRobotsTXT = true
theme ="mainroad"
disqusShortname = "" # Enable comments by entering your Disqus shortname
googleAnalytics = "" # Enable Google Analytics by entering your tracking id

hasCJKLanguage = true # 日本語・中国語・韓国語の単語カウントを有効にする
summaryLength = 120 # サマリーの長さを120単語にする

[pagination]
  pagerSize = 10

[Params.Author]
  name = "かぶきあげ"
  bio = "主戦場は歌舞伎町ですが、その他の場所にも出没します。"
  avatar = "img/logo.jpg"
[Params]
  description = "デリヘルを主とした風俗体験レポートです。" 
  opengraph = true
  twitter_cards = true
  readmore = false # Show "Read more" button in list if true
  authorbox = false
  pager = true
  post_meta = ["date", "categories"] # Order of post meta information
  mainSections = ["posts", "docs"]
#  highlightColor = "#ff1493" # ハイライト色を上書きする
  highlightColor = "#ff8ec6" # ハイライト色を上書きする
  customCSS = ["css/notosansjp.css", "css/custom.css"] # カスタムCSSファイルをインクルードする
[Params.thumbnail]
  visibility = ["list","post"]
  
[Params.logo]
  subtitle = "風俗体験レポート ロハを求めて三千里…" # Logo subtitle
  image = "img/logo.png" 

[Params.sidebar]
  home = "right"   # Configure layout for home page
  list = "right"   # Configure layout for list pages
  single = "right" # Configure layout for single pages
  # Enable widgets in given order
  widgets = ["search", "recent", "categories", "taglist","social"]
[Params.widgets]
  recent_num = 5 # Set the number of articles in the "Recent articles" widget
  tags_counter = false # Enable counter for each tag in "Tags" widget (disabled by default)
# config.toml
# カスタムソーシャルリンク
[[Params.widgets.social.custom]]
  url = "https://x.com/michael_j2333"
  icon = "twitter.svg"
  title = "X（Twitter）"
[[Params.widgets.social.custom]]
  url = "https://line.me/ti/p/neNlAY8Ljk"
  icon = "line.svg"
  title = "LINE"
[[Params.widgets.social.custom]]
  url = "mailto:michae.j332333@gmail.com"
  icon = "email.svg"
  title = "MAIL"
# メインメニュー
#[[Menus.main]]
#  Name = "ホーム"
#  URL = "/"
#[[Menus.main]]
#  Name = "レポート"
#  URL = "/posts/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


[related]
  threshold = 80
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "categories"
    weight = 100

