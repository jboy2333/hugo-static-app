baseURL = "https://www.amazon.co.jp/"
title = "かぶきあげのZOCKレポート"
languageCode = "ja"
theme ="mainroad"
disqusShortname = "" # Enable comments by entering your Disqus shortname
googleAnalytics = "" # Enable Google Analytics by entering your tracking id

hasCJKLanguage = true # 日本語・中国語・韓国語の単語カウントを有効にする
summaryLength = 120 # サマリーの長さを120単語にする

[params.Author]
  name = "かぶきあげ"
  bio = "主戦場は歌舞伎町ですが、その他の場所にも出没します。"
  avatar = "img/avatar.jpg"
[Params]
  description = "John Doe's Personal blog about everything" # Description of your site
  opengraph = true
  twitter_cards = true
  readmore = false # Show "Read more" button in list if true
  authorbox = true
  pager = true
  post_meta = ["date", "categories"] # Order of post meta information
  mainSections = ["posts", "docs"]
  highlightColor = "#ff1493" # ハイライト色を上書きする
  customCSS = ["/css/notosansjp.css", "/css/custom.css"] # カスタムCSSファイルをインクルードする
[Params.thumbnail]
  visibility = ["list"]
  
[Params.logo]
  subtitle = "歌舞伎町を主戦場に風俗の旅へ…" # Logo subtitle
  image = "img/logo.jpg" 

[Params.widgets.social]
  twitter = "jboy2333"
  email = "michae.j332333@gmail.com"

[Params.sidebar]
  home = "right"   # Configure layout for home page
  list = "right"   # Configure layout for list pages
  single = "right" # Configure layout for single pages
  # Enable widgets in given order
  widgets = ["search", "recent", "categories", "taglist","social"]
[Params.widgets]
  recent_num = 5 # Set the number of articles in the "Recent articles" widget
  tags_counter = false # Enable counter for each tag in "Tags" widget (disabled by default)

# メインメニュー
[[Menus.main]]
  Name = "ホーム"
  URL = "/"
[[Menus.main]]
  Name = "レポート"
  URL = "/posts/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
